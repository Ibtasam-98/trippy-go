name: trippygo
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.12.1
  get: ^4.6.6
  font_awesome_flutter: ^10.8.0
  flutter_advanced_drawer: ^1.3.7
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1
  geolocator: ^13.0.2
  location: ^7.0.1
  shared_preferences: ^2.3.5
  get_storage: ^2.1.1
  google_nav_bar: ^5.0.7
  glassmorphism_ui: ^0.3.0
  awesome_snackbar_content:
  firebase_auth:
  cloud_firestore:
  shimmer:
  firebase_storage:
  image_picker:
  flutter_rating_bar:
  intl:
  dynamic_multi_step_form: ^1.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/images/

  fonts:
    - family: grenda
      fonts:
        - asset: assets/fonts/grenda.ttf
          style: normal
    - family: quicksand
      fonts:
        - asset: assets/fonts/quicksand.ttf
          style: normal

    - family: viaodaLibre
      fonts:
        - asset: assets/fonts/ViaodaLibre-Regular.ttf
          style: normal